name: Build Server Browser Packages

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install PyQt6 PyQt6-WebEngine pyinstaller
      - name: Build EXE and ZIP
        run: |
          $script = (Get-ChildItem -Filter "*.py" | Select-Object -First 1).Name
          echo "Found script: $script"
          pyinstaller --noconfirm --onedir --windowed --name "ServerBrowser" `
            --collect-all PyQt6.QtWebEngineCore `
            --collect-all PyQt6.QtWebEngineWidgets `
            --hidden-import PyQt6.QtWebEngineCore `
            "$script"
          Compress-Archive -Path "dist/ServerBrowser" -DestinationPath "dist/ServerBrowser-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE-and-ZIP
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system tools and Python libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm libxcb-cursor0 zip
          sudo gem install fpm
          pip install PyQt6 PyQt6-WebEngine pyinstaller
      - name: Build Binary and Package DEB / RPM / ZIP
        run: |
          SCRIPT=$(ls *.py | head -n 1)
          echo "Found script: $SCRIPT"
          pyinstaller --noconfirm --onedir --windowed --name "server-browser" \
            --collect-all PyQt6.QtWebEngineCore \
            --collect-all PyQt6.QtWebEngineWidgets \
            --hidden-import PyQt6.QtWebEngineCore \
            "$SCRIPT"

          mkdir -p pkg/usr/local/bin
          cp -r dist/server-browser pkg/usr/local/bin/

          # Сборка .deb (Debian / Ubuntu)
          fpm -s dir -t deb -n server-browser -v 1.0.0 -a amd64 -C pkg usr/local/bin/server-browser

          # Сборка .rpm (Fedora / RHEL)
          fpm -s dir -t rpm -n server-browser -v 1.0.0 -C pkg usr/local/bin/server-browser

          # Сборка .zip (Linux portable)
          zip -r server-browser-linux.zip dist/server-browser
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-DEB-RPM-ZIP
          path: |
            server-browser_1.0.0_amd64.deb
            server-browser-1.0.0.x86_64.rpm
            server-browser-linux.zip

